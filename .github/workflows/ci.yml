# Nexus Command CI — runs the exact pipeline verified locally on 2026-07-02:
# fresh Postgres → alembic migrations → demo seed → integration tests, plus a
# production build of the frontend. RAG tests skip automatically (no Ollama in
# CI); no external AI calls are made (dummy CLAUDE_API_KEY, empty GEMINI key).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (migrations + seed + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_core
      # CI-only values — never used outside this workflow, no real data behind them.
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdefghijklmnopqrstuvwxyz0123456789
      SETUP_SECRET: ci-only-setup-secret-abcdef123456
      NEXUS_TOKEN_KEY: ci-only-token-key-0123456789abcdefghijklmnop
      CLAUDE_API_KEY: ci-dummy-key-not-real
      GEMINI_API_KEY: ""
      OLLAMA_HOST: http://localhost:9
      SLACK_ENABLED: "false"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System deps (libmagic for python-magic)
        run: sudo apt-get update -q && sudo apt-get install -y -q libmagic1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations (fresh database)
        run: python create_tables.py
      - name: Seed demo data
        run: python seed_demo.py
      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
