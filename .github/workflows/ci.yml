# Nexus Command CI — runs the exact pipeline verified locally on 2026-07-02:
# fresh Postgres → alembic migrations → demo seed → integration tests, plus a
# production build of the frontend. RAG tests skip automatically (no Ollama in
# CI); no external AI calls are made (dummy CLAUDE_API_KEY, empty GEMINI key).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (migrations + seed + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to post the failure summary as a commit comment
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_core
      # CI-only values — never used outside this workflow, no real data behind them.
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdefghijklmnopqrstuvwxyz0123456789
      SETUP_SECRET: ci-only-setup-secret-abcdef123456
      NEXUS_TOKEN_KEY: ci-only-token-key-0123456789abcdefghijklmnop
      CLAUDE_API_KEY: ci-dummy-key-not-real
      GEMINI_API_KEY: ""
      OLLAMA_HOST: http://localhost:9
      SLACK_ENABLED: "false"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System deps (libmagic for python-magic)
        run: sudo apt-get update -q && sudo apt-get install -y -q libmagic1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations (fresh database)
        run: python create_tables.py
      - name: Seed demo data
        run: python seed_demo.py
      - name: Run tests
        run: python -m pytest tests/ -q --junitxml=junit.xml

      # A red build whose logs need a token to read is a red build nobody
      # diagnoses. On failure, post the actual failing tests as a commit
      # comment, which is readable by anyone who can see the repo.
      - name: Report failing tests on the commit
        # Only when the tests themselves ran and failed — an infrastructure
        # failure (the Postgres service container not starting, say) leaves no
        # JUnit file, and a reporter that fails in that case just adds a second
        # red step that explains nothing.
        if: failure() && hashFiles('backend/junit.xml') != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, xml.etree.ElementTree as ET

          try:
              root = ET.parse("junit.xml").getroot()
          except Exception as e:
              body = f"CI backend tests failed, and the JUnit report was unreadable: {e}"
          else:
              lines = []
              for case in root.iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is None:
                          continue
                      where = f"{case.get('classname','')}::{case.get('name','')}"
                      detail = (node.get("message") or node.text or "").strip()
                      lines.append(f"**{kind.upper()}** `{where}`\n```\n{detail[:1200]}\n```")
              body = ("### CI backend tests failed\n\n" + "\n\n".join(lines)) if lines else \
                     "### CI backend tests failed, but no individual test reported a failure."

          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments",
              data=json.dumps({"body": body[:60000]}).encode(),
              headers={"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                       "Accept": "application/vnd.github+json"},
              method="POST")
          with urllib.request.urlopen(req) as r:
              print("posted commit comment:", r.status)
          PY

      # Called out separately from the suite above so a failure here reads as
      # "a security invariant broke", not "some test failed". These are the
      # standing rules (every route authenticated, AI tool tiers hold), not
      # the per-phase regression tests.
      - name: Security invariants
        run: python -m pytest tests/test_security_coverage.py tests/test_security_phase0.py tests/test_security_phase1.py tests/test_security_phase2.py tests/test_security_phase3.py tests/test_security_phase4.py tests/test_security_phase5.py -q

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements.txt is intentionally unpinned, so every build picks up
      # the current releases — which is why production stays patched without
      # anyone maintaining pins. The trade-off is that a compromised upstream
      # release would flow straight through, so this job is the compensating
      # control: it fails the build on a known-vulnerable dependency.
      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
